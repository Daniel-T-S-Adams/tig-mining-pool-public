[package]
name = "pool-config"
description = "Typed, fail-closed configuration loading for pool binaries (docs/architecture.md §9)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
version = "0.1.0"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
toml = "0.9"
# Parsing the TIG endpoint by hand let userinfo pose as the host: a
# `base_url` of `http://127.0.0.1:8080@api.tig.foundation` read as loopback
# while every client sent to the real API, defeating criterion F4d.
url = "2"

[lints]
workspace = true
