[package]
name = "pool-snapshot"
description = "Block-consistent TIG snapshot assembly (docs/tig_integration.md §9)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
version = "0.1.0"

[dependencies]
pool-domain = { path = "../pool-domain" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    # Hyperparameters and per-bundle qualities are `jsonb`, so this crate binds
    # and reads `serde_json::Value` directly. Declared here rather than
    # inherited: feature unification made `cargo build -p pool-snapshot` work
    # only because `pool-workflow` asked for it, so building this crate alone
    # failed with eight trait-bound errors that said nothing about the cause.
    "json",
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring",
] }
thiserror = "2"
tig-client = { path = "../tig-client" }
tracing = "0.1"

[dev-dependencies]
pool-test-support = { path = "../pool-test-support" }
# `migrate` only here: the library never runs a migration (architecture.md
# §6), but the store's tests need the real migration to build their schema.
sqlx = { version = "0.9", features = ["migrate"] }
fake-tig = { path = "../fake-tig" }
tig-client = { path = "../tig-client", features = ["testing"] }
axum = "0.8"
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
