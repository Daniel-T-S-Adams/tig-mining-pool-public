# Local development configuration for `pool-controller`.
#
# Non-secret by construction (docs/architecture.md §9): this file names the
# path of a password file, never a password. `scripts/dev-db.sh` generates the
# referenced file into the untracked `secrets/` directory.
#
# Usage:
#   ./scripts/dev-db.sh
#   cargo run -p pool-admin -- --config config/pool-admin.dev.toml migrate
#   cargo run -p fake-tig -- --fixture fixtures/tig/v1 --port 8080 \
#       --player 0x2935a721068da756b28cba896efdb64e8909dfae
#   cargo run -p pool-controller -- --config config/pool-controller.dev.toml run
#
# `--player` serves the fixture as though its pool player were the address
# below: the fixture's own is a placeholder that `[tig].player_id` refuses.

network = "testnet"

[database]
host = "127.0.0.1"
port = 5433
name = "pool_dev"
# The controller's own least-privilege role. `validate_for` refuses a config
# that names another, so a controller cannot be handed DDL by editing a file.
user = "pool_controller"
password_file = "secrets/db-controller-password"
statement_timeout_ms = 30000

[telemetry]
format = "json"
level = "info"
deployment = "local-dev"

[tig]
# A local `fake-tig`, which is also what criterion F4d's guard reads: the stub
# acceptance record is refused unless this resolves to a loopback address.
# Pointing this at the real API disables the stub, which is the intent — the
# check is on the endpoint and not on `network`, because `network` is pinned
# to "testnet" either way and could not tell the two apart.
base_url = "http://127.0.0.1:8080"
# The slice-1 testnet identity (docs/plans/slice-1-gateway.md §4). Public: an
# address, not a credential. The API key that pairs with it is never in a
# config file.
player_id = "0x2935a721068da756b28cba896efdb64e8909dfae"
# The TIG source commit this deployment says was acquired and reviewed
# (`tig_integration.md` §15). §13 check 2 compares it against the pin compiled
# into the binary from `config/tig_integration.json`, so the two are different
# artifacts and a mismatch means a binary was deployed beside a configuration
# that moved on. Stated by a person because nothing here acquires the source —
# §15 makes that a reviewed human procedure.
acquired_upstream_commit = "ad08d1ea001a73ff5aab3b556d7f59246fece14e"

[orchestration]
# `mining_system.md` §11 lists this among the values "required before full
# product implementation", as versioned policy with no settled number. This is
# a local development placeholder, not a proposed value: production takes it
# from reviewed policy, and there is deliberately no compiled default to fall
# back to.
internal_pool_unverified_limit = 4
# `get-benchmark-data` reads one poll may spend warming the active-benchmark
# cache (tig_integration.md §5.2). The controller's read share is 1 request
# per second and the poll interval 15 seconds; assembly takes a dozen or so
# reads per block, so this is roughly what a poll has left. A local
# placeholder like the limit above, not a proposed value.
active_cache_fetches_per_poll = 10
