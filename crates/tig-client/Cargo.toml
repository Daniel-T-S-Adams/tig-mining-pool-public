[package]
name = "tig-client"
description = "Rate-limited read client for the TIG API (docs/tig_integration.md §5, §11)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
version = "0.1.0"

[dependencies]
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"

[features]
# Exposes crate internals to tests. Never enabled by a production consumer:
# `testing::pool_ceiling_for_test` hands out the whole per-IP allowance that
# ADR-0006 requires a reader to take a share of, so an unconditionally
# compiled module would be the same hole `pool_ceiling` being pub(crate)
# closes. Proven absent from a default build by scripts/feature-gate.sh.
testing = []

[dev-dependencies]
# Self-reference so this crate's own integration tests see the testing
# module, the way pool-identity does for its spike feature.
tig-client = { path = ".", features = ["testing"] }
axum = "0.8"
httpdate = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
