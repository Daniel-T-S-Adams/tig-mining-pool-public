[package]
name = "spike"
description = "Disposable protocol-spike binaries (docs/plans/protocol-spike.md §3) — findings, not code, are the deliverable"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
version = "0.1.0"

[[bin]]
name = "spike-gateway"
path = "src/bin/spike_gateway.rs"

[[bin]]
name = "spike-member"
path = "src/bin/spike_member.rs"

[[bin]]
name = "spike-pool"
path = "src/bin/spike_pool.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"

[dev-dependencies]
axum = "0.8"
fake-tig = { path = "../fake-tig" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
