[workspace]
resolver = "3"
members = [
    "crates/fake-tig",
    "crates/pool-admin",
    "crates/pool-config",
    "crates/pool-domain",
    "crates/pool-identity",
    "crates/pool-snapshot",
    "crates/pool-telemetry",
    "crates/spike",
    "crates/tig-client",
    "crates/tig-gateway",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
