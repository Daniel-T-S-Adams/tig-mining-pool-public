name: AI Review

# Three AI review passes + a machine-readable verdict gate: one general and
# two domain-invariants reviewers. Design decisions: docs/plans/ai-workflow.md
# (W1/W2). Review is fail-closed: every reviewer must return a valid approval.
# Reviewers are read-only over the checkout and post one PR comment each;
# the gate consumes SHA-bound JSON verdict artifacts, never comment prose.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repo, non-draft PRs only: fork PRs never reach the API key.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - reviewer: general
            model: claude-sonnet-5
            prompt: .github/review/general.md
          - reviewer: invariants
            model: claude-opus-5
            prompt: .github/review/invariants.md
          - reviewer: invariants-fable
            model: claude-fable-5-1
            prompt: .github/review/invariants.md
    name: "AI review: ${{ matrix.reviewer }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Auth decision (docs/plans/ai-workflow.md W1): reviewers run on the
      # repository owner's Claude subscription via a long-lived OAuth token
      # (`claude setup-token` -> secret CLAUDE_CODE_OAUTH_TOKEN). An
      # ANTHROPIC_API_KEY secret is supported as a fallback if ever preferred.
      # A missing credential is recorded as a skipped verdict, which FAILS the
      # verdict gate (fail-closed): review is the primary review layer here
      # and must never silently not-happen.
      - name: Reviewer credential check
        id: key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=AI review credential missing::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY secret is set. Reviewer '${{ matrix.reviewer }}' cannot run; the verdict gate will fail."
            printf '{"reviewer":"%s","head_sha":"%s","verdict":"skipped_no_key","findings":[]}\n' \
              "${{ matrix.reviewer }}" "$HEAD_SHA" > "verdict-${{ matrix.reviewer }}.json"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Claude Code CLI
        if: steps.key.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.261

      - name: Prepare diff
        if: steps.key.outputs.present == 'true'
        run: |
          git fetch --no-tags origin ${{ github.event.pull_request.base.ref }}
          git diff "origin/${{ github.event.pull_request.base.ref }}...HEAD" > /tmp/pr.diff
          BYTES=$(wc -c < /tmp/pr.diff)
          if [ "$BYTES" -gt 400000 ]; then
            head -c 400000 /tmp/pr.diff > /tmp/pr.diff.t && mv /tmp/pr.diff.t /tmp/pr.diff
            echo "::warning title=Diff truncated::PR diff was ${BYTES} bytes; reviewer '${{ matrix.reviewer }}' saw the first 400000."
          fi

      - name: Run reviewer
        id: reviewer
        if: steps.key.outputs.present == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_DIFF: /tmp/pr.diff
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # An empty env var can confuse CLI auth selection — drop unset ones.
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && unset CLAUDE_CODE_OAUTH_TOKEN
          [ -z "$ANTHROPIC_API_KEY" ] && unset ANTHROPIC_API_KEY
          {
            cat "${{ matrix.prompt }}"
            echo
            echo "## This PR"
            echo "Title: ${PR_TITLE}"
            echo "HEAD_SHA: ${HEAD_SHA}"
            echo "REVIEWER_ID: ${{ matrix.reviewer }}"
            echo "Diff file (unified): ${PR_DIFF}"
          } > /tmp/prompt.md
          set +e
          claude -p "$(cat /tmp/prompt.md)" \
            --model "${{ matrix.model }}" \
            --allowedTools "Read,Grep,Glob" \
            > /tmp/raw-output.txt 2> /tmp/claude-err.log
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "reviewer CLI exited $STATUS"; sed -n '1,40p' /tmp/claude-err.log
            printf '{"reviewer":"%s","head_sha":"%s","verdict":"error","findings":[]}\n' \
              "${{ matrix.reviewer }}" "$HEAD_SHA" > "verdict-${{ matrix.reviewer }}.json"
            echo "succeeded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "succeeded=true" >> "$GITHUB_OUTPUT"

      - name: Validate verdict
        if: >
          steps.key.outputs.present == 'true' &&
          steps.reviewer.outputs.succeeded == 'true'
        run: |
          python3 - "$HEAD_SHA" "${{ matrix.reviewer }}" <<'EOF'
          import json, sys, re
          head_sha, reviewer = sys.argv[1], sys.argv[2]
          out = open('/tmp/raw-output.txt').read()
          # Extract the outermost JSON object (reviewers are told JSON-only,
          # but strip any accidental fencing).
          m = re.search(r'\{.*\}', out, re.S)
          invalid = {"reviewer": reviewer, "head_sha": head_sha,
                     "verdict": "invalid", "findings": []}
          try:
              v = json.loads(m.group(0)) if m else None
          except Exception:
              v = None
          ok = (
              isinstance(v, dict)
              and v.get("reviewer") == reviewer
              and v.get("head_sha") == head_sha
              and v.get("verdict") in ("approve", "changes_required")
              and isinstance(v.get("findings"), list)
              and all(isinstance(f, dict) and f.get("severity") in ("must_fix", "should_fix", "nit")
                      and isinstance(f.get("path"), str) and isinstance(f.get("summary"), str)
                      for f in v.get("findings", []))
          )
          if ok:
              has_must = any(f["severity"] == "must_fix" for f in v["findings"])
              if has_must and v["verdict"] != "changes_required":
                  print("consistency violation: must_fix with approve -> invalid")
                  v = invalid
          else:
              print("verdict failed schema/SHA validation -> invalid")
              v = invalid
          json.dump(v, open(f"verdict-{reviewer}.json", "w"), indent=2)
          print(json.dumps(v, indent=2)[:2000])
          EOF

      - name: Post PR comment
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF' > /tmp/comment.md
          import json
          v = json.load(open("verdict-${{ matrix.reviewer }}.json"))
          sev_order = {"must_fix": 0, "should_fix": 1, "nit": 2}
          lines = [f"## AI review ({v['reviewer']}) — `{v['verdict']}` @ {v['head_sha'][:12]}", ""]
          if not v["findings"]:
              lines.append("No findings.")
          for f in sorted(v["findings"], key=lambda f: sev_order.get(f.get("severity"), 3)):
              lines.append(f"- **{f.get('severity')}** `{f.get('path')}:{f.get('line', '?')}` — {f.get('summary')}")
              if f.get("fix"):
                  lines.append(f"  - fix: {f['fix']}")
          lines.append("")
          lines.append("_Machine verdict is the artifact; this comment is informational._")
          print("\n".join(lines))
          EOF
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/comment.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verdict-${{ matrix.reviewer }}
          path: verdict-${{ matrix.reviewer }}.json

  verdict-gate:
    name: "AI review: verdict gate"
    needs: review
    if: always() && needs.review.result != 'cancelled'
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: verdict-*
          merge-multiple: true
      - name: Evaluate verdicts
        run: |
          python3 - "$HEAD_SHA" <<'EOF'
          import glob, json, sys
          head_sha = sys.argv[1]
          files = sorted(glob.glob("verdict-*.json"))
          expected = {"general", "invariants", "invariants-fable"}
          verdicts = {}
          for f in files:
              v = json.load(open(f))
              verdicts[v.get("reviewer")] = v
          missing = expected - set(verdicts)
          if missing:
              print(f"FAIL: missing verdicts from {sorted(missing)}")
              sys.exit(1)
          failed = False
          for name, v in sorted(verdicts.items()):
              if v.get("head_sha") != head_sha:
                  print(f"FAIL [{name}]: verdict is for {v.get('head_sha')}, head is {head_sha}")
                  failed = True
              elif v["verdict"] == "approve":
                  print(f"OK   [{name}]: approve")
              elif v["verdict"] == "skipped_no_key":
                  print(f"FAIL [{name}]: reviewer did not run — credential missing "
                        "(set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY). "
                        "Review is fail-closed; see docs/plans/ai-workflow.md W1.")
                  failed = True
              else:
                  print(f"FAIL [{name}]: {v['verdict']}")
                  for fi in v.get("findings", []):
                      if fi.get("severity") == "must_fix":
                          print(f"       must_fix {fi.get('path')}:{fi.get('line')} {fi.get('summary')}")
                  failed = True
          sys.exit(1 if failed else 0)
          EOF
