# Local development configuration for `pool-api`, the member-facing service.
#
# Non-secret by construction (docs/architecture.md §9): this file names the
# path of a password file, never a password. `scripts/dev-db.sh` generates the
# referenced file into the untracked `secrets/` directory.
#
# Usage:
#   ./scripts/dev-db.sh
#   cargo run -p pool-admin -- --config config/pool-admin.dev.toml migrate
#   cargo run -p pool-api -- --config config/pool-api.dev.toml run

network = "testnet"

[database]
host = "127.0.0.1"
port = 5433
name = "pool_dev"
# The member service's own least-privilege role. Migrations 0018–0022 grant it
# what the member surface writes and nothing else; `architecture.md` §6 keeps
# creating a write intent and advancing a workflow away from it entirely.
user = "pool_api"
password_file = "secrets/db-api-password"
statement_timeout_ms = 30000

[telemetry]
format = "json"
level = "info"
deployment = "local-dev"

# There is deliberately no [tig] section. `architecture.md` §2.2 puts the TIG
# API key in `tig-gateway` alone, and §3 gives this process no reason to reach
# TIG at all; `validate_for` refuses a `pool-api` config that carries one.

[member_api]
# `architecture.md` §11.2 puts a TLS proxy in front of this process, so this is
# the private address that proxy reaches — loopback in development, where there
# is no proxy and no member but the local agent. An address literal rather than
# a hostname: a DNS answer can change between restarts.
listen = "127.0.0.1:8081"
# The dedicated key every enrollment and recovery ticket is hashed under
# (security.md §4.1). The path, never the key — `scripts/dev-db.sh` generates
# the referenced file into the untracked `secrets/` directory, readable only
# by the owner. `pool-api` refuses to start if it is missing, short, or
# readable by anyone else.
ticket_hmac_key_file = "secrets/ticket-hmac-key"
# The domain a member's wallet shows them when they sign in, compared byte for
# byte (accounting.md §12.2). Two deployments are two pools: a signature made
# for one must not authorise anything at the other.
pool_domain = "local-dev.bench-pool.invalid"
# Base Sepolia. Stated rather than derived — `network` is pinned to "testnet"
# and could not tell one Base chain from the other.
login_chain_id = 84532
# The largest control-message body this deployment reads. The floor is what
# the pinned request schemas can produce — a maximal `HeartbeatRequest` is
# 383156 bytes compactly encoded — and the ceiling is §10.3's 64 MiB chunk,
# the largest body the protocol defines at all. This is 512 KiB: above the
# floor with room for an agent whose JSON encoder is not compact, and far
# below anything that would make a control message a place to put bulk.
# Chunk bodies are bounded separately, by the upload session's own chunk size,
# and the route that carries them is registered outside this limit.
max_control_body_bytes = 524288
